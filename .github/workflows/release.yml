name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binaries (Portable & Setup)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python test_suite.py

      - name: Download & Extract FFmpeg Essentials
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Downloading FFmpeg release essentials..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          New-Item -ItemType Directory -Force -Path "ffmpeg"
          Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Copy-Item -Destination "ffmpeg\ffmpeg.exe"
          Get-ChildItem -Path "ffmpeg_temp" -Filter "LICENSE*" -Recurse | Copy-Item -Destination "ffmpeg\"
          Remove-Item -Recurse -Force "ffmpeg_temp", "ffmpeg.zip"
          Write-Host "FFmpeg successfully staged in ./ffmpeg"

      - name: Verify source code before build
        shell: powershell
        run: |
          Write-Host "=== Verifying source files ==="
          Write-Host "Main script first 5 lines:"
          Get-Content bbbStudentDownloader.py -Head 5
          Write-Host ""
          Write-Host "Checking for v2.1 in main script:"
          Select-String -Path bbbStudentDownloader.py -Pattern "v2.1" | ForEach-Object { $_.Line.Trim() }
          Write-Host ""
          Write-Host "Core modules:"
          Get-ChildItem core\*.py | ForEach-Object { Write-Host "  $($_.Name) - $($_.Length) bytes" }
          Write-Host ""
          Write-Host "Checking crash log handler:"
          Select-String -Path bbbStudentDownloader.py -Pattern "bbb_crash" | ForEach-Object { $_.Line.Trim() }

      - name: Build Portable Executable (PyInstaller)
        shell: powershell
        run: |
          Write-Host "Building standalone executable..."
          python -m PyInstaller --clean --noconfirm --onefile --windowed `
            --collect-all customtkinter `
            --hidden-import core `
            --hidden-import core.engine `
            --hidden-import core.parser `
            --hidden-import core.converter `
            --hidden-import core.downloader `
            --hidden-import core.study_pack `
            --hidden-import core.ffmpeg_helper `
            --add-data "assets/app_icon.ico;assets" `
            --add-data "core;core" `
            --icon "assets\app_icon.ico" `
            --name bbbStudentDownloader bbbStudentDownloader.py
          Copy-Item "dist\bbbStudentDownloader.exe" "dist\bbbStudentDownloader-Portable.exe"
          Write-Host "Portable build complete: dist\bbbStudentDownloader-Portable.exe"
          Write-Host ""
          Write-Host "=== Verifying built exe contains new code ==="
          $bytes = [System.IO.File]::ReadAllBytes("dist\bbbStudentDownloader.exe")
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          $checks = @("v2.1", "bbb_crash", "poll_clipboard", "check_updates_background")
          foreach ($check in $checks) {
            if ($text.Contains($check)) { Write-Host "  FOUND: $check" } else { Write-Host "  MISSING: $check" }
          }

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          if (!(Get-Command iscc -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          Write-Host "Compiling Windows installer with ISCC..."
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" setup.iss
          Write-Host "Installer build complete: Output\bbbStudentDownloaderSetup.exe"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bbbStudentDownloader-Windows-Binaries
          path: |
            dist/bbbStudentDownloader-Portable.exe
            Output/bbbStudentDownloaderSetup.exe

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: |
            dist/bbbStudentDownloader-Portable.exe
            Output/bbbStudentDownloaderSetup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
