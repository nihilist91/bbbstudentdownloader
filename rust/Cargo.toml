[package]
name = "bbb-studyforge"
version = "2.2.0"
edition = "2021"
description = "BigBlueButton lecture archiver & AI study suite (Rust port of the Python core)"
license = "MIT"

[lib]
name = "bbb_studyforge"
path = "src/lib.rs"

[[bin]]
name = "bbb-studyforge"
path = "src/main.rs"

[[bin]]
name = "bbb-studyforge-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
indexmap = "2"
ureq = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
xz2 = "0.1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"], optional = true }
rfd = { version = "0.18.0", optional = true }
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"], optional = true }

[features]
# Desktop GUI: cargo build --release --features gui
gui = ["dep:eframe", "dep:rfd", "dep:egui"]

[profile.release]
opt-level = 3
strip = true

[build-dependencies]
winresource = "0.1.34"
